[package]
name = "antigen-stroma"
description = "The stroma: a sovereign immune lattice over composed resolution (read-write-constitute coordinate frame + base node-set)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# The scan feeder: stroma consumes antigen's ScanReport/ItemTarget. Direction is
# stroma -> antigen (NEVER reverse), keeping antigen salsa-free for its light consumers.
antigen = { path = "../antigen" }
# The shape-digest (FNV) tier reused for clustering/backdate; identity-digest (BLAKE3) is added here.
antigen-fingerprint = { path = "../antigen-fingerprint" }

# The relational base + clock.
salsa = { workspace = true }
ascent = { workspace = true }   # ENGINE epoch fills the closure; frame declares so the stub typechecks
blake3 = { workspace = true }   # ADR-067 §A.2 identity-digest (signing tier)

# syn: needed by ShapeDigest::of_item (parses item source strings) and by the
# constitute adapter's file-level item walk. Same workspace dep as antigen-fingerprint.
syn = { workspace = true }
# proc-macro2 + quote: needed by constitute/adapter.rs to render stripped syn::Item to canonical
# token strings (the BLAKE3 preimage — same approach as antigen-fingerprint's digest_tokens).
proc-macro2 = { workspace = true }
quote = { workspace = true }

serde = { workspace = true }
# cargo `--message-format=json` diagnostic parsing (the dead-code F-producer; pure string->data).
serde_json = { workspace = true }
# SCIP protobuf index parser (the resolved-feeder wiring).
scip = "0.9"
protobuf = "=3.7.2"

[dev-dependencies]
tempfile = { workspace = true }
# examples/dual_tier_barcode.rs: walks the workspace crate src/ dirs for the syntactic (syn)
# call-edge feeder — dev-only so walkdir stays out of the core lib's dependency surface.
walkdir = { workspace = true }
# faer: DEV-ONLY sparse/dense linear algebra for sheaf EXPERIMENTS (least-squares residuals,
# nullspace bases, Laplacian spectra) that `sheaf::rank` cannot do. The hand-rolled path stays
# the shipped one; see the graduation trigger on the workspace entry. Dev-only keeps faer out of
# the core lib's dependency surface, same rationale as walkdir above.
faer = { workspace = true }
# Compile-state born-red harness (trybuild): the C3 "law encoded in types, not runtime" ATKs —
# TIER-CAP (syntactic cannot construct presents) + TORN-READ (publish-while-reading is a borrow
# error) assert the unsound interleaving does NOT compile. Same harness as antigen-macros.
trybuild = { workspace = true }
# syn: the end-to-end DIGEST-STRIP ATK parses real items (#[presents] fn …) to a syn::Item to drive
# IdentityDigest::of_item — proving tamper-evidence on the load-bearing/pure attr partition (§4.3).
syn = { workspace = true }
# examples/store_spike.rs (SPIKE, jbd/research/decisions/layered-derivation-store.md): project the
# stroma into an RDF quad store to find gaps before committing. sophia = backend-agnostic RDF/SPARQL
# model (Term/Graph/Dataset traits + in-memory dataset + N-Quads/TriG serde); redb = pure-Rust
# embedded KV store (persistence, no RocksDB/C++). Dev-only — never reaches antigen/cargo-antigen.
sophia = "0.10"
redb = "2"
