[workspace]
resolver = "3"
members = [
    "antigen",
    "antigen-attestation",
    "antigen-fingerprint",
    "antigen-macros",
    "antigen-stroma",
    "cargo-antigen",
]
# The falsifier harness is a publish=false reproducible research artifact (the syntactic-vs-SCIP
# edge-rate bench), not shipped product — excluded from the workspace so CI does not gate throwaway
# experiment code, while it stays on disk and buildable standalone (cd antigen-stroma-experiment).
exclude = ["antigen-stroma-experiment"]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.95"
authors = ["Christopher Averill <c@tek.gy>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/antigen-rs/antigen"
homepage = "https://github.com/antigen-rs/antigen"
readme = "README.md"
keywords = ["immunity", "memory", "failure-class", "lint", "antibody"]
categories = ["development-tools", "development-tools::cargo-plugins", "development-tools::testing"]

[workspace.dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
# faer: sparse/dense linear algebra, pure Rust (no C/Fortran). DEV-ONLY, and deliberately so.
# The hand-rolled sparse elimination in `sheaf::rank` is the SHIPPED path and is measured
# sufficient at current scale (fill-in 0.30x, 6.3s, 0.2 MB on antigen's 17564-edge coboundary),
# so faer is NOT here for performance -- claiming that would contradict our own measurement.
# It is here to EXPERIMENT with three capabilities the hand-rolled path cannot provide:
# least-squares (the graded per-edge residual `sheaf.rs` calls its PRIMARY output), a nullspace
# BASIS (the actual global sections, not just dim H0), and the sheaf-Laplacian SPECTRUM (the
# Hodge/Cheeger direction). Keeping it dev-only means zero consumer dependency surface and no
# feature matrix; an example can run BOTH implementations as a differential oracle.
# GRADUATION TRIGGER (do not let this drift either way): promote to a real, on-by-default
# dependency the moment (a) a capability proven useful here must be callable by an ORGAN at
# runtime (i.e. from the lib, not an example), or (b) the hand-rolled path hits a MEASURED wall
# on a real corpus. Until then it stays dev-only; if neither trigger fires, drop it.
faer = "0.23"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust git plumbing for the SZZ corpus-miner's full-object-graph walk
# (`rev-list --all` over `.git`) — used ONLY by cargo-antigen (the CLI does the
# git I/O; the antigen lib stays subprocess-free per ADR-002, the vcs_witness
# pattern). The most-downloaded pure-Rust git crate; read-surface only.
gix = "0.84"

# The stroma's relational base + clock (ADR-068). salsa 0.27.2 is the MEASURED-mature
# version — the atomic-publish keystone (the &db / &mut db borrow-split) was verified
# against 0.27.2 source. Only `antigen-stroma` depends on these; `antigen` stays
# salsa-free so its light consumers (cargo-antigen, the attribute scanner) don't compile it.
salsa = "0.27.2"
# Semiring-datalog closure (ascent). The ENGINE epoch fills the closure bodies; the FRAME
# epoch declares the dep so the engine-stub signatures typecheck in the same crate.
ascent = "0.8"
# Collision-resistant identity-digest tier (ADR-067 §A.2). FNV-1a (in antigen-fingerprint)
# is engineer-collidable and stays the SHAPE tier only; BLAKE3 is the signing/identity tier.
blake3 = "1.8"

# Dev-only: property-based tests for parser invariants (W1).
# proptest 1.x has been stable since 2017; we hold to that line.
proptest = "1"
# Dev-only: trybuild compile-error fixture harness (W2).
trybuild = "1"
# Dev-only: tempdir helper for filesystem-fixture integration tests
# (used by `antigen/tests/atk_a2_adversarial.rs` and similar).
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Pedantic and nursery lints, opt-in to the strict-but-helpful subset.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow a few overly-strict pedantic lints that don't add value here.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Allow uninlined_format_args because it conflicts with rustfmt sometimes.
uninlined_format_args = "allow"
# Allow some lints inside doctests / examples where ergonomics matter.
needless_pass_by_value = "allow"
